    <style>
      /* Instant developer splash — paints before the JS bundle loads */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #c9b896;
        opacity: 0;
        animation: boot-splash-in 700ms ease-out 80ms forwards;
        transition: opacity 550ms ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #boot-splash.is-out {
        opacity: 0 !important;
        pointer-events: none;
      }
      #boot-splash picture,
      #boot-splash img {
        display: block;
        width: min(72vw, 420px);
        height: auto;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.65));
      }
      #boot-splash .boot-hint {
        margin: 1.4rem 0 0;
        font-family: Sora, 'Segoe UI', sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(201, 184, 150, 0.55);
        opacity: 0;
        animation: boot-splash-in 600ms ease-out 900ms forwards;
      }
      @keyframes boot-splash-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
